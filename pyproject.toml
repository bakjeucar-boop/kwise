[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kwise"
version = "0.1.0"
description = "건물 전력 비용 진단 및 개선안 비교 도구"
readme = "README.txt"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pvlib>=0.11",
    "holidays>=0.40",
    "streamlit>=1.35",
    "altair>=5.3",
    "openpyxl>=3.1",
    # 9세션 — 의사결정자용 Word 보고서. 표는 Word 표 객체로, 차트만 png 다.
    # **36세션에 화면에서 감췄다.** 만드는 코드와 시험은 그대로라 의존성도 남긴다.
    "python-docx>=1.1",
    # 36세션 — 의사결정자용 PPT 보고서. 순수 파이썬이라 OS 의존성이 없다.
    "python-pptx>=1.0",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# mypy 는 판을 못박는다. 두 PC 의 도구 판이 갈리면 한쪽에서만 실패한다 —
# 배포의 requirements.txt 를 == 로 못박은 것과 같은 이유다 (2026-08-15).
#
# 상한이 tests\ 오류를 없애 주지는 않는다. 2.3.1 이 33건, 1.20.2 가 38건으로
# 오히려 구판이 더 문다 — 그 오류는 판과 무관하게 원래 있던 것이다
# (PROCEED.md 「도구·형 정리」). 여기서 고정하는 것은 결과의 재현성이지
# 통과 여부가 아니다. 판단은 `mypy src` 로 한다.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11,<2",
    # batch.py 의 import yaml. 없으면 strict 가 stub 없다고 잡는다.
    # 적어 두지 않으면 PC 마다 있고 없고가 갈린다 — 상한을 박는 것과 같은 이유다.
    "types-PyYAML",
    # 43세션 — 시험 병렬. 순차 13분이 4워커에서 4분대가 된다.
    # **판을 못박는다.** 배분 방식(`--dist`)의 동작이 판마다 달라지면
    # 한 PC 에서만 시험이 갈라진다 — mypy 를 못박은 것과 같은 이유다.
    "pytest-xdist>=3.8,<4",
    # 65세션 — `tools\capture_screen.py` 가 화면을 진짜 브라우저로 열어 찍는다.
    # **앱이 쓰는 것이 아니므로 `[project.dependencies]` 에 두지 않는다** —
    # 그쪽은 Streamlit Cloud 가 읽어 배포에 깔린다. 확인용 도구일 뿐이다.
    #
    # **꾸러미만으로는 안 돈다.** 브라우저 바이너리를 따로 받아야 한다 —
    # `.venv\Scripts\python.exe -m playwright install chromium`.
    # 도구가 없을 때 그 줄을 그대로 낸다 (조용히 실패하지 않게).
    "playwright>=1.4",
    # 90세션 — `data\source\` 의 PDF 원문에서 글을 뜬다. **앱은 PDF 를 읽지
    # 않는다** — 규정 원문을 확인하는 자리에서만 쓰므로 여기에 둔다.
    #
    # 이 PC 에는 PDF 에서 글을 뜰 수단이 없었다 — poppler 가 없어
    # 하네스의 PDF 읽기가 안 되고, Word COM 은 세 번 다 열지 못했다
    # (`명령을 정상적으로 종료할 수 없습니다`). 순수 파이썬이라 OS 의존성이
    # 없다 — `python-pptx` 를 고른 것과 같은 이유다.
    "pypdf>=5.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
# reference\ 는 읽기 전용 참조 코드다. 검사 대상에서 제외한다.
extend-exclude = ["reference", ".venv", "cache", "output"]

[tool.ruff.format]
# **`PROCEED.md` 는 이력이다** (67세션 4절). `ruff format` 이 md 안의 python
# 코드 블록까지 고치는 바람에 지난 세션이 적어 둔 조각이 다시 쓰였다.
# 기록은 그때 적은 대로 둔다 — 커밋 이름을 그대로 두는 것과 같은 이유다.
exclude = ["PROCEED.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warning
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "PTH",  # 경로는 pathlib 만 쓴다
    "ANN",  # 타입힌트
    "RUF",
]
ignore = [
    "RUF001", # 주석·문자열에 한글과 전각 기호가 섞이는 것은 정상이다
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401"]
# 기준 데이터 값은 JSON 에서 오므로 본디 Any 다. 형을 좁히면 거짓말이 된다.
"src/kwise/rules/*" = ["ANN401"]
# 되읽기 도구도 같은 이유다 — 엑셀 셀 값은 형이 정해져 있지 않다.
"tools/build_rules.py" = ["ANN401"]
# 측정용 래퍼는 감싸는 함수의 서명을 모른다. 형을 좁히면 거짓말이 된다.
"src/kwise/benchmark.py" = ["ANN401"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "tools"]
exclude = "^(reference|\\.venv|build)/"
strict = true
# pandas·numpy 등은 타입 스텁을 제공하지 않는다.
ignore_missing_imports = true
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "pvlib.*",
    "holidays.*",
    "streamlit.*",
    "altair.*",
    "matplotlib.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::FutureWarning"]
